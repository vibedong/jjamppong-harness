version: 0.2.0
name: jjamppong-harness-gate-contract-matrix
notes:
  - Workflow gates are not the same as capability approvals.
  - Capability approvals are summarized in implementation-approval.md and task.yaml approval_summary.
  - Missing or ambiguous capabilities are denied.
  - Gate checks inspect current state and artifacts, not event history.

gates:
  install:
    user_label: 설치만 하기
    previous: []
    reads: [file.read.project]
    writes: [installer.install]
    required_artifacts: [harness.lock.yaml, install-summary]
    forbidden: [project_planning_start, prd, issues, module_creation, code, tests, fixtures, live_access, git.commit, git.push]
    transition_to: [stop, intake]
    verify_ids: [T001, T002, T003]

  intake:
    user_label: 요청 기록
    previous: [install_or_existing_project]
    reads: [user_prompt]
    writes: [task.yaml, planning/00-current-planning-context.md]
    required_artifacts: [task.yaml]
    forbidden: [project_file_read, prd, module_creation, code, tests, live_access]
    transition_to: [grill]
    verify_ids: [T004]

  grill:
    user_label: 압박 질문
    previous: [intake]
    reads: [user_prompt, prior_user_answers, task.yaml]
    writes: [planning/01-grill-summary.md, task.yaml]
    required_artifacts: [grill-summary]
    forbidden: [project_scan_before_approval, docs_first, prd, issues, folders, code, tests, live_access]
    transition_to: [research]
    verify_ids: [T005, T006, T007]

  research:
    aliases: [evidence_check]
    user_label: 자료조사 / 근거 확인
    previous: [grill]
    reads: [file.read.project, network.web_research, task.yaml, planning/01-grill-summary.md]
    writes: [planning/02-research-summary.md, task.yaml]
    required_artifacts: [research-summary]
    forbidden: [network.live_target, package.install, code, tests, folders, prd_approval_without_user]
    transition_to: [grill, compound_lookup, prd]
    verify_ids: [T008, T009, T022, T023]

  compound_lookup:
    user_label: 이전 배운 점 확인
    previous: [research]
    reads: [task.yaml, knowledge.index, archive.summary, selected_top_learnings]
    writes: [planning/02b-compound-lookup.md, task.yaml]
    required_artifacts: [compound-lookup-summary]
    forbidden: [archive_raw_default_read, past_learning_over_current_intent, unapproved_proposal_as_rule]
    transition_to: [prd]
    verify_ids: [T040]

  architecture_orientation:
    user_label: 기술 구성 설명
    previous: [grill]
    reads: [task.yaml, planning_context]
    writes: [planning/02c-architecture-orientation.md, task.yaml]
    required_artifacts: [architecture-orientation]
    forbidden: [technology_forcing_without_user, code]
    transition_to: [prd]

  prd:
    user_label: PRD / 기획 확정
    previous: [grill, research]
    reads: [task.yaml, grill-summary, research-summary]
    writes: [planning/03-prd.md, planning-pack.md, task.yaml]
    required_artifacts: [approved_prd]
    forbidden: [implementation, code, tests, folder_creation]
    transition_to: [issues]
    verify_ids: [T011]

  issues:
    user_label: 이슈 나누기
    previous: [prd]
    reads: [task.yaml, planning/03-prd.md]
    writes: [planning/04-issues.md, planning-pack.md, task.yaml]
    required_artifacts: [approved_issues]
    forbidden: [code, tests, live_access]
    transition_to: [module_structure]

  module_structure:
    user_label: 구조 나누기
    previous: [prd, issues]
    reads: [task.yaml, planning/03-prd.md, planning/04-issues.md]
    writes: [planning/05-module-structure.md, module_structure_state_projection, task.yaml]
    required_artifacts: [approved_module_structure]
    forbidden: [folder_creation, code, tests, fixtures, live_access]
    transition_to: [writing_plan, folder_skeleton]
    verify_ids: [T016]

  writing_plan:
    user_label: 구현계획 쓰기
    previous: [issues, module_structure]
    reads: [task.yaml, planning/00-current-planning-context.md, prd, issues, module_structure]
    writes: [planning/06-writing-plan.md, task.yaml]
    required_artifacts: [writing_plan]
    forbidden: [code, tests, fixtures, live_access]
    transition_to: [plan_review]
    verify_ids: [T010]

  plan_review:
    user_label: 계획 리뷰
    previous: [writing_plan]
    reads: [task.yaml, planning/06-writing-plan.md]
    writes: [planning/07-plan-review.md, task.yaml]
    required_artifacts: [plan_review]
    forbidden: [implementation_unlock, code, tests, fixtures, live_access]
    transition_to: [folder_skeleton, implementation]
    verify_ids: [T010]

  folder_skeleton:
    user_label: 빈 폴더틀 승인
    previous: [module_structure]
    reads: [task.yaml, planning/05-module-structure.md]
    writes: [approved_empty_dirs, approved_gitkeep, approved_placeholder_docs, task.yaml]
    required_artifacts: [folder_skeleton_approval]
    forbidden: [executable_source, tests, fixtures, runtime_config, package_files, live_access]
    transition_to: [implementation, writing_plan]
    verify_ids: [T017, T018]

  implementation:
    user_label: 진짜 작업 승인
    previous: [plan_review]
    reads: [task.yaml, planning/03-prd.md, planning/04-issues.md, planning/05-module-structure.md, planning/06-writing-plan.md, planning/07-plan-review.md]
    writes: [implementation-approval.md, task.yaml]
    required_artifacts: [implementation-approval.md, approval_summary]
    effect_capabilities: [file.write.module, exec.test, exec.build, package.install, network.live_target, git.commit, git.push]
    forbidden: [implicit_capability, approval_scope_expansion]
    transition_to: [work]
    verify_ids: [T012, T013, T014, T015]

  work:
    user_label: 작업 실행
    previous: [implementation]
    reads: [task.yaml, implementation-approval.md]
    writes: [approved_target_paths, task.yaml]
    required_artifacts: [approval_summary, implementation_approval]
    forbidden: [scope_creep, unapproved_outside_modules, unapproved_live_access, unapproved_git, unapproved_package_install]
    transition_to: [verification]
    verify_ids: [T020, T021, T022, T024, T025, T026, T027, T028]

  verification:
    user_label: 검증
    previous: [work]
    reads: [task.yaml, implementation-approval.md]
    writes: [verification.md, task.yaml]
    required_artifacts: [commands_run, expected_actual, exit_codes, risk_status]
    forbidden: [new_feature_work]
    transition_to: [acceptance, compound_capture]

  acceptance:
    user_label: 사용자 확인
    previous: [verification]
    reads: [task.yaml, verification.md]
    writes: [acceptance.md, task.yaml]
    required_artifacts: [accepted_or_deferred_or_blocked]
    forbidden: [silent_archive_without_acceptance_status]
    transition_to: [compound_capture, archive]

  compound_capture:
    user_label: 배운 점 정리
    previous: [verification]
    reads: [task.yaml, verification.md]
    writes: [learning-capture.md, knowledge_draft, task.yaml]
    required_artifacts: [learning_capture]
    forbidden: [live_rule_edit]
    transition_to: [compound_review, archive]
    verify_ids: [T039]

  compound_review:
    user_label: 배운 점 장기반영 검토
    previous: [compound_capture]
    reads: [task.yaml, learning_capture, compound_state, solutions_index]
    writes: [compound-review.md, task.yaml]
    required_artifacts: [compound_review_decision]
    forbidden: [silent_solution_promotion, raw_transcript_storage]
    transition_to: [archive, proposal]
    verify_ids: [T042]

  proposal:
    user_label: 개선 제안
    previous: [compound_review_or_user_request]
    reads: [task.yaml, planning_context]
    writes: [proposals/active/*.md, task.yaml]
    required_artifacts: [proposal_doc]
    forbidden: [live_harness_core_change_without_approval]
    transition_to: [template_maintenance, archive]
    verify_ids: [T031, T032]

  archive:
    user_label: 완료 보관
    previous: [verification]
    reads: [task.yaml, verification.md, learning-capture.md]
    writes: [archive-summary.md, tasks/index.md, archive_move, task.yaml]
    required_artifacts: [archive_summary]
    forbidden: [active_left_dirty, raw_archive_as_hot_context]

  handoff:
    user_label: 새 채팅 인계
    previous: [user_requested]
    reads: [task.yaml, planning/00-current-planning-context.md]
    writes: [handoff.md]
    required_artifacts: [handoff_summary, next_chat_prompt]
    forbidden: [automatic_handoff_update]
