version: 0.2.0
name: permission-decision-schema

required_fields:
  - decision_id
  - schema_version
  - task_id
  - requested_action
  - capability
  - decision
  - reason
  - based_on
  - created_at

decisions:
  - allow
  - deny
  - block
  - proposal_required

requested_action_fields:
  action_type:
    enum:
      - file_read
      - file_write
      - file_delete
      - command_exec
      - network_access
      - package_install
      - git_operation
      - installer_operation
      - harness_core_change
      - parallel_write
  path: {type: string, required: false}
  command: {type: string, required: false}
  network_target: {type: string, required: false}
  package_name: {type: string, required: false}

capability_examples:
  file_write_module: file.write.module
  live_target: network.live_target
  package_install: package.install
  git_push: git.push
  secret_read: file.read.secret

based_on:
  required:
    - current_gate
    - task_yaml_approval_summary
    - implementation_approval_headings
    - contract_versions
  fields:
    current_gate: string
    task_yaml_approval_summary: object
    implementation_approval_headings: array
    contract_versions: object

approval_summary:
  implementation_values: [locked, approved, revoked]
  dangerous_capabilities_require:
    - implementation: approved
    - allowed_capabilities match
    - allowed_paths match for file writes
    - implementation-approval.md required headings
  boolean_capability_fields:
    package.install: package_install
    network.live_target: network_live_target
    git.commit: git_commit
    git.push: git_push

path_policy_result:
  required_when: path_present
  fields:
    raw_path: string
    normalized_path: string
    absolute_path: string
    realpath: string
    project_root: string
    is_within_project_root: boolean
    is_within_modules: boolean
    has_symlink_or_junction: boolean
    matched_allowed_pattern: string
    escape_detected: boolean

required_next_action:
  fields:
    type:
      enum: [ask_user, open_gate, create_proposal, run_verify, stop]
    gate_id: string
    suggested_user_question: string
    missing_capabilities: array

invalidation:
  approval_must_bind_to:
    - current_gate
    - target_paths
    - capability_flags
    - explicit_user_approval_in_current_chat
  invalidates_when:
    - prd_changed
    - issues_changed
    - module_structure_changed
    - writing_plan_changed
    - target_paths_changed
    - capability_need_added
    - user_added_new_constraint
    - contract_version_changed
