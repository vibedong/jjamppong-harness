version: 0.2.0
name: task-schema

state_surface: task.yaml
approval_surface: implementation-approval.md
verification_surface: verification.md
handoff_surface: handoff.md
stores_history: false

allowed_task_types:
  - install
  - module_bootstrap
  - product_feature
  - product_bugfix
  - template_maintenance
  - project_policy_change
  - harness_update
  - knowledge_maintenance
  - archive_maintenance

task_yaml:
  status: current_state_cache
  may_be_regenerated: true
  grants_permission_alone: false
  required_fields:
    - task_id
    - task_type
    - status
    - current_gate
    - created_at
    - updated_at
    - next_action
    - approval_summary
  approval_summary:
    status: machine_readable_cache_derived_from_current_chat_approval
    grants_permission_alone: false
    requires_human_approval_surface_for_dangerous_capabilities: true
    required_fields:
      - implementation
      - allowed_capabilities
      - allowed_paths
      - package_install
      - network_live_target
      - git_commit
      - git_push
      - approval_source
    implementation_values:
      - locked
      - approved
      - revoked

task_types:
  module_bootstrap:
    purpose: Create module workspace only.
    allowed_capabilities:
      - file.write.folder_skeleton
      - file.write.task_artifact
    denied_capabilities:
      - file.write.module_executable_source
      - tests.create
      - fixtures.create
      - package.install
      - network.live_target
      - git.commit
      - git.push
    allowed_files:
      - directories
      - .gitkeep
      - MODULE.md
      - README.md
      - module-state.md
    denied_files:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.ps1"
      - "*.sh"
      - tests/**
      - fixtures/**
      - package.json
      - pyproject.toml
      - executable runtime config

  product_feature:
    purpose: Implement approved vertical slice inside approved module paths.
    requires:
      - grill
      - research
      - prd
      - issues
      - module_structure
      - writing_plan
      - plan_review
      - implementation
    default_root: modules/

  template_maintenance:
    purpose: Change harness-core rules/contracts/installer/plugins.
    requires:
      - proposal_approved
      - separate_template_maintenance_checkout
    forbidden:
      - product_code
      - project_domain_solution_as_core_rule_without_proposal

  project_policy_change:
    purpose: Change project-local policy only.
    requires:
      - project_policy_proposal
    forbidden:
      - harness_core_rule_change

state_files:
  planning_current_context:
    path: planning/00-current-planning-context.md
    status: human_readable_hot_context
    max_preferred_size: 12KB
  implementation_approval:
    path: implementation-approval.md
    status: human_readable_approval_summary
    cannot_grant_permission_without_task_yaml_approval_summary: true
  verification:
    path: verification.md
    status: human_readable_verification_summary
  handoff:
    path: handoff.md
    status: human_readable_next_chat_summary
